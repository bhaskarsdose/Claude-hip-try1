<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hip Bone Reconstruction</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>Hip Bone Reconstruction</h1>
    <p class="sub">
      Upload a hip-bone segmentation mask (<code>.nii.gz</code>, e.g. produced
      by TotalSegmentator) and the model will predict the missing piece for
      3D-printable prosthetic use.
    </p>
  </header>

  <main>
    <section class="upload">
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".nii,.nii.gz" hidden />
        <span>Drop a <code>.nii.gz</code> mask here, or click to choose</span>
      </label>
      <button id="run" disabled>Reconstruct</button>
      <p id="status" class="status"></p>
      <p id="model-banner" class="banner hidden"></p>
    </section>

    <section class="viewers">
      <div class="viewer">
        <h2>Input bone</h2>
        <div id="viewer-input" class="canvas"></div>
        <a id="dl-input" class="dl hidden" download="input.stl">Download input.stl</a>
      </div>
      <div class="viewer">
        <h2>Predicted implant</h2>
        <div id="viewer-implant" class="canvas"></div>
        <a id="dl-implant" class="dl hidden" download="implant.stl">Download implant.stl</a>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
